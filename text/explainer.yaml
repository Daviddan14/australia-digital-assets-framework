# The explainer. Citations are written {{passage-id}} (see passages.yaml).
#
# In each section:
#   law        what the Act, ASIC or the Government say. Every paragraph is cited.
#   companies  what Redbelly or Tokeniser say about themselves. Every paragraph is cited.
#   meaning    analysis: how this guide reads the sources. Kept visibly apart.
#   unsettled  analysis of a point no source settles.

title: The Digital Assets Framework Act, in plain words
subtitle: What Australia's new platform licensing law means for issuers, for holders, and for Tokeniser on Redbelly Network
checked: 25 October 2026
site_url: https://australia-digital-assets-framework.vercel.app

key_dates:
  - date: 27 November 2026
    label: ASIC consultation closes {{mr-closes}}
  - date: 8 April 2027
    label: The Act commences {{act-commence-date}}
  - date: 7 October 2027
    label: Last day for existing operators to apply {{cp-apply-by}}

notice: >-
  **General information, not legal advice.** This guide describes an Australian law
  and public documents in everyday language. It is not legal, financial or tax advice,
  it does not recommend any product, and it does not tell any business whether it needs
  a licence. Several ASIC documents used here are drafts released for consultation, so
  the final versions may differ {{mr-commencing}}. ASIC's own draft guide says it is not
  legal advice and that anyone unsure should seek legal or regulatory advice
  {{rg-disclaimer rg-unsure}}.

short:
  - q: What does the Act do?
    a: >-
      It treats two kinds of custody business as financial products. In a **digital asset
      platform**, a business keeps digital tokens on behalf of others. In a **tokenised
      custody platform**, a business looks after a real asset and issues one token that
      stands for it {{act-products act-dap act-tcp}}.
  - q: When does it start?
    a: >-
      On **8 April 2027** {{act-commence-date cp-apply-by}}. A business already running
      such a platform has until **7 October 2027** to apply for a licence, and can keep
      operating while ASIC decides {{cp-apply-by}}.
  - q: Who needs a licence?
    a: >-
      The operator of the platform, unless an exemption applies {{rg-who-needs}}. Small
      digital asset platforms are exempt if they hold no financial products, handle no
      more than $10 million of transactions a year, keep each client's holdings within
      $5,000 (valued when tokens are added), and notify ASIC {{act-low-value}}.
  - q: What changes for issuers?
    a: >-
      Less than many expect. When a fund keeps its primary register of unit holders on
      chain, ASIC's draft guide would usually treat it as a managed investment scheme
      rather than a tokenised custody platform {{rg-native}}. The new rules bite hardest
      on whoever holds investors' tokens or assets.
  - q: Where does Redbelly fit?
    a: >-
      Its identity and eligibility tools can enforce the kind of eligibility rules the Act
      asks platforms to set out, though the platform operator still has to make those
      rules transparent and non-discriminatory {{act-eligibility rb-receptor-verifier}}.
      Whether the network counts as public digital token infrastructure, which sits
      outside licensing, is not settled {{act-pdti cp-pdti-select}}.

sections:
  - id: what
    title: What the Act is, and why it exists
    lede: A short law with a large reach. It adds two financial products and leaves most of the detail to ASIC.
    law:
      - >-
        Its full name is the Corporations Amendment (Digital Assets Framework) Act 2026,
        numbered No. 38 of 2026 {{act-number}}. Parliament passed it on 1 April 2026 and it received Royal
        Assent on 8 April 2026 {{cp-passed act-assent}}.
      - >-
        It amends the law on corporations and financial services: the Corporations Act
        2001, and also the ASIC Act {{act-amends act-corps act-asic-act}}.
      - >-
        Its central change is to add two new kinds of **financial product**: a digital
        asset platform and a tokenised custody platform, in each case unless the platform
        is a managed investment scheme {{act-products}}. If a facility is one of these and
        no exemption applies, its operator needs an Australian financial services (AFS)
        licence {{rg-who-needs}}.
      - >-
        When the Bill was introduced, the Government said it was meant to help unlock
        innovation and protect Australians investing in digital assets
        {{tsy-introduced}}. It pointed to a gap: a business could look after any amount of
        its clients' digital assets with no financial-law safeguards in place, and
        collapses overseas had shown what weak oversight costs {{tsy-gap}}.
      - >-
        ASIC describes the Act as addressing regulatory gaps and uncertainty about digital
        assets, with the aim of fostering innovation, competition and growth
        {{cp-purpose}}. Its Commissioner summed up ASIC's approach as "same activity, same
        risk, same regulatory outcome" {{mr-same-activity}}.
    meaning:
      - >-
        Read together, the definitions point to one idea: **the licence follows
        custody**. A business comes into the new rules by holding tokens, or holding real
        assets behind tokens, on behalf of other people. Using a blockchain, issuing a
        token or keeping your own tokens is not, by itself, what the definitions describe
        {{act-dap act-tcp rg-merely-possessing}}.
      - >-
        The Act sets the frame and leaves the working detail to ASIC standards, ASIC
        guidance and Government regulations that are still being written. Most of that
        detail is due in 2027 {{cp-stage-publish rg-anticipated-regs}}.

  - id: terms
    title: Six terms that do most of the work
    lede: The Act turns on a handful of defined words. These are the ones worth knowing.
    law_table:
      caption: Key terms in the Act
      head: [Term, What it means, Section]
      widths: ["24%", "60%", "16%"]
      rows:
        - - Digital token
          - "An electronic record that someone can factually control: they can move it, block others from moving it, and prove they can do both {{act-token}}."
          - s 761GB
        - - Possess
          - What counts is what a person can do in fact, not their legal rights {{act-token-fact}}. A person does not jointly possess a token if they need someone else's cooperation and that other person can act alone {{act-joint}}.
          - s 761GB(3), s 86
        - - Digital asset platform (DAP)
          - A facility where an operator possesses digital tokens for or on behalf of another person {{act-dap}}.
          - s 761GC
        - - Tokenised custody platform (TCP)
          - A facility where an operator holds an asset other than money and creates a single token for each asset. Holding the token gives a right to redeem the asset or direct its delivery {{act-tcp}}. A TCP cannot also be a DAP {{act-tcp-not-dap}}.
          - s 761GD
        - - Public digital token infrastructure (PDTI)
          - Open source, publicly accessible protocols that work without discretion, let any person contribute to running the network, and do not depend on one critical participant {{act-pdti}}. PDTI is not a financial product {{act-pdti-not-product}}.
          - s 9E, s 765A
        - - Platform rules
          - The operator's rules for a licensed platform. They must include transparent and non-discriminatory criteria for who can become a client {{act-eligibility}}.
          - s 912BG
    meaning:
      - >-
        "Possess" carries much of the weight. If investors alone control the keys to their
        tokens, nobody else possesses those tokens for them, so that part of an
        arrangement does not look like a DAP. If a business controls the keys for them, it
        may well be one {{act-token act-dap}}.

  - id: licence
    title: Licences, who is in and who is out
    lede: The operator of a platform needs one, unless an exemption fits. Several exemptions do.
    law:
      - >-
        If a facility is a DAP or TCP and no exemption applies, the operator must hold an
        AFS licence that authorises it to issue that type of platform {{rg-who-needs}}.
        ASIC says related services, such as dealing in or advising about DAPs and TCPs,
        will also need a licence {{cp-related-services}}.
      - >-
        The platform is a financial product in its own right, separate from the tokens or
        assets held through it {{rg-separate-product}}. Whether a token is itself a
        financial product is a different question, which ASIC answers in its existing
        guide, INFO 225 {{rg-two-guides}}.
      - >-
        **Small digital asset platforms.** The Act exempts the issue of a DAP when four
        conditions are all met: none of the group's platforms holds financial products;
        transactions through them total no more than $10 million over the last 12 months;
        whenever a token is added for a client, the client's holdings across the platforms
        total no more than $5,000, with each token valued at the time it was added; and
        the operator has lodged a notice with ASIC {{act-low-value}}. The Government called these "smaller, low-risk platforms"
        {{tsy-small}}.
      - >-
        Regulations can raise those amounts {{act-low-value-raise}}, and ASIC's draft
        guide says the tests will rise with inflation {{rg-inflation}}. The exemption is
        written for digital asset platforms only {{act-low-value}}.
      - >-
        **Pointing people to a platform.** A business that only tells people a DAP or TCP
        exists, or arranges for them to use one, does not need a licence for that if it
        does so in the ordinary course of its business and those services are not a
        significant part of the business {{act-arranging}}.
      - >-
        **Validators.** Running consensus on public digital token infrastructure is not a
        financial service, and the infrastructure itself is not a financial product
        {{act-consensus-not-service act-pdti-not-product}}.
      - >-
        **Exemptions still to come.** ASIC expects Government regulations to extend some
        existing custody exemptions to DAPs and TCPs, subject to Government processes
        {{rg-anticipated-regs}}. An exemption from licensing does not stop an arrangement
        being a DAP or TCP {{rg-exemption-still-dap}}.
      - >-
        **Arrangements outside the definitions.** Merely possessing tokens is not enough;
        they must be possessed for a client {{rg-merely-possessing}}. A facility may also
        fall outside both definitions if the client cannot direct how the assets are dealt
        with {{rg-cannot-direct}}, although it may then be another kind of financial
        product {{rg-other-product}}.
    steps:
      title: A rough self-check
      items:
        - Do you, or someone acting for you, possess digital tokens for another person? That describes a DAP {{act-dap}}.
        - Do you hold an asset other than money and create one token for it that lets the holder redeem it? That describes a TCP {{act-tcp}}.
        - Does an exemption fit, such as the small platform exemption or the advise and arrange exemption {{act-low-value act-arranging}}?
        - If not, the operator needs an AFS licence {{rg-who-needs}}. A business already operating must apply by 7 October 2027 {{cp-apply-by}}.
      note: This is a summary to help you find the right questions, not a legal test. ASIC's draft guide says that if you are unsure, seek legal or regulatory advice {{rg-unsure}}.
    meaning_table:
      caption: Where some common roles are likely to sit (this guide's reading)
      head: [Role, Likely position, Why]
      rows:
        - - An exchange or app that holds customers' tokens
          - Likely a DAP, so a licence is needed unless an exemption fits
          - It possesses tokens for clients {{act-dap rg-who-needs}}
        - - A business that holds gold bars and issues one redeemable token per bar
          - Likely a TCP
          - An asset other than money, one token each, redeemable {{act-tcp}}
        - - A token for a mixed basket of assets
          - Not a TCP on ASIC's draft view; other rules may apply
          - ASIC's example is a token for 1 gram of gold and 1 kg of silver {{rg-mixed-pool}}
        - - A wallet app where only the user controls the keys
          - Not a DAP on that basis alone
          - Nobody else possesses the tokens {{act-token act-joint}}
        - - A fund that issues its units as tokens and keeps the unit holder register on chain
          - Generally a managed investment scheme, not a TCP, on ASIC's draft view
          - ASIC's note on native tokenisation {{rg-native}}
        - - A validator on a public network
          - Not providing a financial service, if the network is PDTI
          - Consensus on PDTI is excluded {{act-consensus-not-service}}
        - - A website that refers users to a platform as a minor sideline
          - May fit the advise and arrange exemption
          - Not a significant part of the business {{act-arranging}}

  - id: dates
    title: The dates that matter
    lede: Royal Assent in April 2026, a year's wait, then six months for existing businesses to apply.
    timeline:
      - date: 26 November 2025
        state: past
        text: The Bill is introduced, and the Minister's second reading speech is made in the House of Representatives {{tsy-introduced act-second-reading}}
      - date: 5 February 2026
        state: past
        text: Second reading speech in the Senate {{act-second-reading}}
      - date: 1 April 2026
        state: past
        text: Parliament passes the Act {{cp-passed}}
      - date: 8 April 2026
        state: past
        text: Royal Assent {{act-assent}}
      - date: April 2026
        state: past
        text: ASIC publishes its implementation roadmap {{mr-roadmap-april}}
      - date: 30 June 2026
        state: past
        text: Original deadline to apply for a licence under ASIC's no-action position for businesses already covered by current law {{deadline-30-june}}
      - date: 30 September 2026
        state: past
        text: Extended deadline for that no-action position {{mr-no-action-extended}}
      - date: 15 October 2026
        state: past
        text: ASIC releases Consultation Paper 392 with its draft guide and standards {{cp-stage-released}}
      - date: 27 November 2026
        state: next
        text: ASIC's consultation closes at 5pm AEDT {{mr-closes cp-stage-feedback}}
      - date: March 2027
        state: future
        text: ASIC plans to publish its final instruments and guidance {{cp-stage-publish}}
      - date: 8 April 2027
        state: future
        key: true
        text: The Act commences and licence applications open {{act-commence-date cp-stage-open}}
      - date: 8 April to 7 October 2027
        state: future
        key: true
        text: Six-month transition period for businesses already operating {{act-transition cp-stage-close}}
      - date: From 8 October 2027
        state: future
        key: true
        text: Operators need a DAP or TCP authorisation unless an exemption applies {{cp-from-8-october}}
    law:
      - >-
        During the transition period, a business already providing these services can
        apply to ASIC. If it does, the new rules do not apply to that service until the
        day after ASIC decides the application {{act-apply-keep-going}}. If it does not
        apply in time, the new rules apply as soon as the transition period ends
        {{act-no-apply}}.
      - >-
        ASIC is considering publishing a list of firms that apply by 7 October 2027, so
        the public can see who may keep operating while their application is decided
        {{cp-list}}. ASIC says it has already recorded over 140 applications from
        businesses seeking to provide digital asset-related financial services
        {{mr-applications}}.
    callout:
      title: 8 April or 9 April 2027?
      paragraphs:
        - >-
          Some documents give 9 April 2027 as the start date, including ASIC's roadmap, an
          earlier ASIC news item and the TASK-30 brief {{roadmap-9-april deadline-9-april
          brief-9-april}}.
        - >-
          The Act sets its start as the day after the end of the 12 months beginning on
          the day of Royal Assent {{act-commence-rule}}. Royal Assent was given on 8 April
          2026 {{act-assent}}, so the 12 months run to 7 April 2027 and the Act starts on
          8 April 2027. The commencement table records 8 April 2027 {{act-commence-date}};
          that column is not formally part of the Act {{act-column3}}, but it matches the
          rule. ASIC's October 2026 documents also use 8 April 2027 {{mr-commencing
          cp-apply-by}}. This guide uses 8 April 2027.
    meaning:
      - >-
        ASIC says the Act provides for an 18-month implementation timeline
        {{roadmap-9-april}}. On this guide's reading, that is the 12 months before the Act
        starts plus the six-month transition {{act-commence-rule act-transition}}.

  - id: issuers
    title: Issuers on Tokeniser, and what actually changes for them
    lede: For many issuers, less than expected. The new rules mostly land on whoever holds tokens or assets for investors.
    law:
      - >-
        Tokenising an asset does not by itself create a TCP. ASIC's draft guide says not
        every arrangement that tokenises an existing asset is one
        {{rg-not-every-tokenisation}}. Its examples include a token for a mixed pool of
        assets, and an arrangement where the operator makes investment decisions for the
        client {{rg-mixed-pool rg-investment-decisions}}.
      - >-
        For funds, ASIC's draft view is direct: where each token is a unit in a unit trust
        and the blockchain is the primary register of unit holders, the arrangement would
        generally be a managed investment scheme rather than a TCP {{rg-native}}. A
        platform that is a managed investment scheme is not one of the two new products
        {{act-products}}.
      - >-
        Where a TCP is used, its underlying assets can include financial products,
        including tokens that are financial products {{rg-tcp-financial-products}}. For a
        TCP to stay outside the managed investment scheme rules, the Act requires, among
        other things, that all its underlying assets are of the same class and that a
        token is only as divisible as the asset can be physically delivered in parts
        {{act-tcp-mis-test}}.
      - >-
        An issuer that makes a securities offer needing a disclosure document through a
        DAP or TCP must promptly tell the platform operator and each custodian about key
        events {{act-offer-notify}}, such as a supplementary or replacement document being
        lodged {{act-offer-events}}. The disclosure document does not have to describe the
        platform itself {{act-offer-no-platform-info}}.
      - >-
        Any licensed platform must have platform rules with transparent,
        non-discriminatory eligibility criteria, and must tell potential clients whether
        and how their purchases will be recorded in any legal or technical register
        {{act-eligibility act-register}}.
    companies:
      - >-
        Tokeniser says it operates on Redbelly Network, which it calls Australia's public
        digital token infrastructure {{tk-runs-on}}, and that funds can run their registry
        and investor lifecycle on it {{tk-registry}}.
      - >-
        It describes its product as "engineered to align with Australia's Digital Assets
        Framework, operating under your existing licence" {{tk-existing-licence}}. It says
        trades that fail an eligibility check do not proceed {{tk-checks}}, and that
        eligibility, identity and the target market determination are enforced at the
        point of transfer {{tk-tmd}}.
      - >-
        Asked in its technology FAQ whether a new licence is needed to use the
        infrastructure, Tokeniser answers "No", saying the protocol layer is designed to
        sit outside markets, clearing and settlement, and custody licensing
        {{tk-no-new-licence}}. These are the company's own statements about its product.
    meaning:
      - >-
        For a fund manager that uses Tokeniser to keep its unit register on chain, ASIC's
        draft view suggests the fund remains a managed investment scheme {{rg-native}}.
        The rules that already govern the fund keep applying, and the new platform regime
        is not the main question for the fund itself.
      - >-
        The new regime matters at the edges. If the manager, Tokeniser or a wallet
        provider controls investors' tokens for them, that party could be operating a DAP.
        If someone holds a separate asset and issues one redeemable token for it, that
        could be a TCP {{act-dap act-tcp}}.
    unsettled:
      - >-
        The Tokeniser pages this guide relied on do not say who controls investors' keys,
        so whether any part of the service is a DAP cannot be told from them. Its "no new
        licence" answer also rests on Redbelly being public digital token infrastructure,
        which the next section shows is not settled.
    checklist:
      title: Questions an issuer may want to put to its own advisers
      items:
        - "Who controls the private keys for investors' tokens: the investor, the issuer, Tokeniser or a custodian?"
        - Is the on-chain record the legal register of holders, or a copy of a register kept elsewhere?
        - Does anyone hold an underlying asset and issue one redeemable token for it?
        - Who makes the investment decisions?
        - Are the eligibility rules transparent and non-discriminatory, and do they match the fund's target market?
        - How will secondary trading happen, and who runs that venue?

  - id: redbelly
    title: Redbelly against the new rules, what fits and what is open
    lede: Strong on identity and eligibility. The open question is whether the network itself counts as public digital token infrastructure.
    companies:
      - >-
        Redbelly describes Receptor as its native digital identity and verifiable
        credential protocol {{rb-receptor-what}}. Its verifier module is used to "define
        eligibility criteria" and check users' credentials {{rb-receptor-verifier}}, so
        that only eligible users can access particular products and services
        {{rb-receptor-only-eligible}}.
      - >-
        Every participant must prove who they are before gaining access to the network
        {{rb-must-prove}}. For an access credential, a user proves through an accredited
        issuer that they hold a valid passport, checked biometrically {{rb-passport}}.
        Businesses can be verified too {{rb-business-verify}}.
      - >-
        The Eligibility SDK lets developers run checks such as age and KYC using
        privacy-preserving proofs {{rb-esdk}}, and the onboarding SDK covers wallet
        authentication, KYC and on-chain permission setup {{rb-onboarding}}.
      - >-
        Redbelly states that "Redbelly is Digital Public Token Infrastructure"
        {{rb-claims-pdti}} and that its finality means transactions cannot be reversed
        {{rb-finality}}. It was selected for the Reserve Bank of Australia's Project
        Acacia pilot {{rb-acacia}}.
    fit_table:
      caption: The new rules beside Redbelly's design
      head: [What the rules call for, What Redbelly offers, This guide's reading]
      status: [ok, ok, ok, part, gap, open]
      rows:
        - - Platform rules with transparent, non-discriminatory eligibility criteria {{act-eligibility}}
          - Verifiable credentials and a verifier that defines and checks eligibility at the point of trade {{rb-receptor-verifier rb-point-of-trade}}
          - "**Lines up.** The tools can enforce criteria. The operator still has to write criteria that are transparent and non-discriminatory; a tool does not make them so."
        - - Platform rules that set out the settlement method {{act-settlement-method}}
          - Deterministic finality {{rb-finality}}
          - "**Lines up.** Final settlement gives the operator something definite to describe. The duty to describe it stays with the operator."
        - - Knowing who is on the platform, so eligibility can be applied
          - Identity proof for every participant, with passport and biometric checks {{rb-must-prove rb-passport}}
          - "**Lines up.** It is a starting point only. Whatever obligations a licensee has stay with the licensee."
        - - Saying whether and how purchases are recorded in a legal or technical register {{act-register}}
          - A shared ledger, with Tokeniser offering on-chain registries {{tk-registry}}
          - "**Partly.** The chain can be the technical record. Whether it is also the legal register is the issuer's choice, and that choice affects how ASIC may classify a fund."
        - - Asset-holding standards on safeguarding, records and reconciliation {{act-asset-standards}}
          - Not described in the Redbelly pages this guide relied on
          - "**Not covered.** Custody is done by whoever controls the keys, not by the network."
        - - Being public digital token infrastructure, outside licensing {{act-pdti}}
          - Redbelly says it is PDTI; Tokeniser says it is designed to meet the three statutory tests {{rb-claims-pdti tk-three-tests}}
          - "**Not settled.** See below."
    unsettled:
      - >-
        The Act's second test asks whether the protocols "permit any person to contribute"
        to running the infrastructure {{act-pdti}}. ASIC's draft guidance says
        infrastructure where "only select persons" can conduct consensus is not PDTI, and
        that this could include KYC restrictions; minimum staking or hardware requirements
        that apply to everyone are unlikely to count against it {{cp-pdti-select}}. ASIC
        gives public permissionless blockchains as an example of PDTI
        {{cp-pdti-permissionless}}.
      - >-
        On Redbelly's own pages, node operator applicants "will be selected based upon
        their previous experience, location and commitment to the Redbelly Project"
        {{rb-node-selected}}, and applications were closed when this guide checked
        {{rb-node-closed}}. Every network participant must also prove their identity
        {{rb-must-prove}}. The 100,000 RBNT stake applies to all nodes {{rb-node-stake}},
        which is the kind of universal threshold ASIC's draft says is unlikely to matter.
      - >-
        Two different things are being gated here. Identity checks for users decide who
        can transact; selection of node operators decides who can help run the network.
        The PDTI test is about the second, so node selection is the closer fit to ASIC's
        concern, while the KYC point could matter too because ASIC names it.
      - >-
        No regulator has said whether Redbelly is PDTI in any source this guide found, and
        ASIC's guidance is still a draft. ASIC also says licensing is assessed at a point
        in time, not on a future expected state {{cp-pdti-point-in-time}}, so the answer
        could change as the network's design changes.
      - >-
        Why it matters: if Redbelly is PDTI, running it is not a financial service and the
        network is not a financial product {{act-consensus-not-service
        act-pdti-not-product}}. If it is not, activities on and around it would have to be
        assessed under the ordinary rules. That would not mean anyone is acting
        unlawfully. It means the answer is not yet known.

  - id: holders
    title: What holders get from the new rules
    lede: The protections attach to platforms that hold assets for you.
    law:
      - >-
        A licensed operator must give a retail client a DAP/TCP Guide before issuing the
        platform to them {{act-guide}}. It must include what a person would reasonably
        need to understand the platform and its risks {{act-guide-content}}, and the
        method and extent of all charges {{act-guide-charges}}.
      - >-
        The platform rules act as a contract under seal between the licensee and each
        client {{act-rules-contract}}.
      - >-
        ASIC's standards must require money held under a platform, other than its
        underlying assets, to be held in trust for clients {{act-money-trust}}. They must
        not stop an operator holding many clients' tokens in one wallet if its own
        accounts identify which tokens are each client's {{act-one-wallet}}.
      - >-
        The Government listed access to dispute resolution and compensation among the
        core obligations that come with the licence {{tsy-obligations}}.
    meaning:
      - >-
        A holder who keeps their own keys is not a client of any platform for those
        tokens, so these protections do not apply to them. The protections matter when
        someone else holds the keys.

  - id: open
    title: What is still open
    lede: Several pieces arrive between now and April 2027.
    meaning:
      - ASIC's final guide and standards, planned for March 2027 {{cp-stage-publish}}.
      - Government regulations for further exemptions {{rg-anticipated-regs}}.
      - The financial requirements for licensees, including net tangible assets, which are part of ASIC's consultation {{mr-firms-will-need}}.
      - Whether identity-gated networks with selected node operators, such as Redbelly, count as PDTI {{cp-pdti-select}}.
      - Whether ASIC will publish a list of businesses that applied in time {{cp-list}}.
      - Anyone can comment on ASIC's proposals until 5pm AEDT on 27 November 2026 {{mr-closes}}.

  - id: method
    title: How this guide was checked
    lede: Every statement of fact can be traced to a passage in a saved copy of its source.
    meaning:
      - >-
        Every factual statement cites the passage it relies on, and the [source
        list](source-list.html) quotes each passage word for word with a link to the source.
      - >-
        Primary sources come first: the Act as made, then the Government's own statement
        and ASIC's papers. Company pages are used only to report what the companies say
        about themselves.
      - >-
        Each source was saved as plain text on 25 October 2026 with a SHA-256
        fingerprint. A script checks that every quoted passage appears in its saved copy,
        that every statement of law cites a source, and that no sentence says Redbelly,
        Tokeniser or any issuer is licensed or compliant.
      - >-
        The Explanatory Memorandum to the Bill is not cited directly because its host
        blocked automated download. Where ASIC quotes it, this guide cites ASIC.
      - >-
        Text under "What this means" and "Not settled" is this guide's analysis. Text
        under "What the law says" and "What the companies say" reports the sources.
