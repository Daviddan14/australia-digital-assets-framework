# The short version the DAO can share. Paragraphs are cited like the explainer;
# the thread posts carry no citations, and every fact in them is cited in the
# explainer and in the paragraphs above them.

title: Share the short version
lede: A few paragraphs and a seven-post X thread the DAO can share. Each one carries the "not legal advice" line.

paragraphs:
  - >-
    General information, not legal advice. Australia's Digital Assets Framework Act
    starts on 8 April 2027 {{act-commence-date cp-apply-by}}. It turns two kinds of
    custody business into licensed financial products: digital asset platforms, which
    hold tokens for clients, and tokenised custody platforms, which hold a real asset and
    create one token for it {{act-products act-dap act-tcp}}.
  - >-
    Businesses already running one can keep going if they apply for a licence by
    7 October 2027 {{cp-apply-by}}. Small digital asset platforms are exempt if they hold
    no financial products, handle no more than $10 million of transactions a year, keep
    each client's holdings within $5,000 (valued when tokens are added), and notify ASIC
    {{act-low-value}}.
  - >-
    For issuers, a fund that keeps its primary register of unit holders on chain would
    usually be a managed investment scheme on ASIC's draft view, not a tokenised custody
    platform {{rg-native}}. The new platform rules bite hardest on whoever holds
    investors' tokens or assets.
  - >-
    Redbelly's identity and eligibility tools fit the Act's demand for transparent,
    non-discriminatory eligibility rules {{act-eligibility rb-receptor-verifier}}. Whether
    Redbelly counts as public digital token infrastructure, which sits outside licensing,
    is not settled: ASIC's draft says networks where only select persons can run
    consensus are not, and Redbelly selects its node operators {{cp-pdti-select
    rb-node-selected}}. ASIC is taking feedback until 27 November 2026 {{mr-closes}}.

thread:
  - "1/ From 8 April 2027, businesses that hold tokens or tokenised assets for other people in Australia come under ASIC licensing. A plain-words guide for issuers, holders and Tokeniser on Redbelly, with a source for every fact. General information only, not legal advice."
  - "2/ The new licence follows custody. Hold tokens for other people? That is a digital asset platform. Hold a real asset and create one redeemable token for it? That is a tokenised custody platform. Both need an AFS licence unless an exemption fits."
  - "3/ Already operating? Apply by 7 October 2027 and you can keep going while ASIC decides. Miss it and the new rules apply straight away."
  - "4/ Small digital asset platforms are exempt: no financial products, no more than $10m of transactions a year, no more than $5,000 per client (valued when tokens are added), and a notice lodged with ASIC."
  - "5/ Issuers: if your fund keeps its primary unit holder register on chain, ASIC's draft view is that it would usually be a managed investment scheme, not a tokenised custody platform. The platform rules bite hardest on whoever holds investors' tokens."
  - "6/ Redbelly's identity and eligibility tools line up with the Act's call for transparent, non-discriminatory eligibility rules. Open question: is Redbelly public digital token infrastructure? ASIC's draft says select-validator networks are not. No regulator has ruled."
  - "7/ ASIC takes feedback until 27 November 2026. Full guide, every source quoted word for word: {site_url} General information only, not legal advice."
