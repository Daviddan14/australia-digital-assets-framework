    quote: "To ensure a baseline of accountability, all network participants MUST prove they are who they say they are before gaining access, a process facilitated by Receptor, Redbelly's native identity protocol."
  - id: rb-business-verify
    source: rb-identity
    at: Identity and participation on the network
    quote: "organisations can be verified to ensure that other network parties can be confident that they're interacting with licensed entities, official representatives and official smart contracts on chain."
  - id: rb-passport
